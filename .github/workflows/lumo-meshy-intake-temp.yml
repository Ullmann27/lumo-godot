      - name: Audit GLB containers and build immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root=pathlib.Path('intake')
          tasks={}
          for line in (root/'task_ids.txt').read_text().splitlines():
              n, task=line.split()
              tasks[n]=task
          rows=[]
          for n,task in sorted(tasks.items()):
              glb=root/'models'/f'vehicle_{n}.glb'
              img=root/'source_images'/f'vehicle_{n}.png'
              data=glb.read_bytes()
              assert len(data) > 1000, (glb, len(data))
              assert data[:4] == b'glTF', (glb, data[:4])
              _,version,total=struct.unpack('<4sII',data[:12])
              assert version==2 and total==len(data), (glb,version,total,len(data))
              image=img.read_bytes()
              assert image.startswith(b'\x89PNG\r\n\x1a\n'), img
              rows.append({
                  'index':int(n),'task_id':task,
                  'glb':str(glb),'glb_bytes':len(data),
                  'glb_sha256':hashlib.sha256(data).hexdigest(),
                  'source_image':str(img),'source_image_bytes':len(image),
                  'source_image_sha256':hashlib.sha256(image).hexdigest()
              })
          assert len(rows)==14, len(rows)
          (root/'manifest.json').write_text(json.dumps({
              'batch':'LUMO Meshy vehicle-body candidates 2026-11-23',
              'count':len(rows),
              'identity_policy':'index + Meshy task_id only; no guessed Kart name',
              'items':rows
          },indent=2,ensure_ascii=False)+'\n')
          print('GLB intake PASS',len(rows))
          PY
          cat intake/manifest.json

      - name: Save review artifact with current fleet references
        uses: actions/upload-artifact@v4
        with:
          name: lumo-meshy-vehicle-intake-review
          path: intake/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit durable incoming binaries without guessed identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p art/lumo_kart/meshy_incoming/models art/lumo_kart/meshy_incoming/source_images
          cp intake/models/*.glb art/lumo_kart/meshy_incoming/models/
          cp intake/source_images/*.png art/lumo_kart/meshy_incoming/source_images/
          cp intake/manifest.json art/lumo_kart/meshy_incoming/manifest.json
          git config user.name "LUMO Asset Intake"
          git config user.email "64243701+Ullmann27@users.noreply.github.com"
          git add art/lumo_kart/meshy_incoming
          git commit -m "assets(kart): preserve 14 Meshy vehicle candidates by task identity"
          git push origin HEAD:asset/lumo-meshy-intake-20261123
