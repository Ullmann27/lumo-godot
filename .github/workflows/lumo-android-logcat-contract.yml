name: Lumo Kart Android logcat contract QA
on:
  push:
    branches: [chatgpt/kart-android-adb-resilience-2026-10-16]
  pull_request:
    paths:
      - tools/test_android_startup.sh
      - tools/tests/test_android_logcat_transport.py
      - .github/workflows/lumo-android-logcat-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate full production Android startup shell syntax
        run: bash -n tools/test_android_startup.sh
      - name: Run actual transport retry and crash-guard contract
        run: python3 -m unittest tools.tests.test_android_logcat_transport -v
