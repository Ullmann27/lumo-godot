name: Lumo Kart asphalt original-vs-new render QA
on:
  push:
    branches:
      - chatgpt/kart-asphalt-material-polish-2026-10-16
  pull_request:
    paths:
      - assets/shaders/kart_asphalt.gdshader
      - scripts/games/kart_world.gd
      - scripts/tests/kart_asphalt_material_regression.gd
      - tools/qa/compare_asphalt_before_after.py
      - .github/workflows/lumo-asphalt-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-3d-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.6.3 and software GL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          python3 -m pip install --quiet --user Pillow==11.3.0
      - name: Import new candidate and run real road material regression
        run: |
          set -euo pipefail
          mkdir -p exports/asphalt/before exports/asphalt/after exports/asphalt/comparison exports/asphalt/logs
          /tmp/godot --headless --editor --path . --import --quit 2>&1 | tee exports/asphalt/logs/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' exports/asphalt/logs/import.log
          timeout 180s /tmp/godot --headless --path . --script res://scripts/tests/kart_asphalt_material_regression.gd 2>&1 | tee exports/asphalt/logs/material.log
          grep -F '[KartAsphalt] PASS:' exports/asphalt/logs/material.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' exports/asphalt/logs/material.log
      - name: Render six real 3D Sonnenhafen captures with improved shader
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://scripts/tests/kart_sonnenhafen_showcase.gd 2>&1 | tee exports/asphalt/logs/after.log
          grep -F '[SonnenhafenShots] captured 06_overview' exports/asphalt/logs/after.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' exports/asphalt/logs/after.log
          cp exports/sonnenhafen/{01_start_grid,02_grandstand,03_terraced_curve,04_waterfall,05_harbour_run,06_overview}.png exports/asphalt/after/
      - name: Rebuild immutable baseline and capture identical cameras
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          BASELINE="$RUNNER_TEMP/lumo-asphalt-before"
          git clone -q --no-hardlinks . "$BASELINE"
          # actions/checkout uses shallow depth=1; explicitly fetch the
          # immutable before commit instead of assuming local git history.
          git -C "$BASELINE" remote set-url origin https://github.com/Ullmann27/lumo-godot.git
          git -C "$BASELINE" fetch --depth 1 origin ea69d122c7c36d0b4b5ffaab388321ddb0931967
          git -C "$BASELINE" checkout --detach FETCH_HEAD
          test "$(git -C "$BASELINE" rev-parse HEAD)" = "ea69d122c7c36d0b4b5ffaab388321ddb0931967"
          (cd "$BASELINE" && /tmp/godot --headless --editor --path . --import --quit) 2>&1 | tee exports/asphalt/logs/before-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' exports/asphalt/logs/before-import.log
          (cd "$BASELINE" && timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://scripts/tests/kart_sonnenhafen_showcase.gd) 2>&1 | tee exports/asphalt/logs/before.log
          grep -F '[SonnenhafenShots] captured 06_overview' exports/asphalt/logs/before.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' exports/asphalt/logs/before.log
          cp "$BASELINE"/exports/sonnenhafen/{01_start_grid,02_grandstand,03_terraced_curve,04_waterfall,05_harbour_run,06_overview}.png exports/asphalt/before/
      - name: Compare six original frames and preserve visual evidence
        run: |
          set -euo pipefail
          python3 tools/qa/sonnenhafen_visual_gate.py exports/asphalt/after | tee exports/asphalt/logs/after-image-gate.log
          python3 tools/qa/compare_asphalt_before_after.py \
            exports/asphalt/before exports/asphalt/after exports/asphalt/comparison \
            | tee exports/asphalt/logs/compare.log
          test "$(find exports/asphalt/comparison -name 'comparison_*.png' | wc -l)" -eq 6
          test -s exports/asphalt/comparison/comparison_metrics.json
      - name: Upload untouched source frames and annotated comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-asphalt-godot-original-before-after-${{ github.run_id }}
          path: |
            exports/asphalt/
          retention-days: 21
          if-no-files-found: warn
