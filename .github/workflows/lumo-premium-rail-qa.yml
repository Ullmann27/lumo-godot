name: Lumo premium rail first-track validation

on:
  push:
    branches:
      - chatgpt/lumo-railkit-first-track-2026-10-15
  pull_request:
    paths:
      - 'scripts/games/kart_premium_rail_kit.gd'
      - 'scripts/games/kart_world.gd'
      - 'scripts/games/kart_world_meshes.gd'
      - 'scripts/tests/kart_premium_rail_regression.gd'
      - '.github/workflows/lumo-premium-rail-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-rail-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot-bin
          key: lumo-rail-godot-4.6.3-stable
      - name: Install Godot 4.6.3
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-bin"
          curl -fSL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
      - name: Import assets and check scripts
        run: |
          set -euo pipefail
          export GODOT_BIN="$HOME/godot-bin/godot"
          "$GODOT_BIN" --version
          timeout 180 "$GODOT_BIN" --headless --editor --import --quit 2>&1 | tee /tmp/rail-import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/rail-import.log; then exit 1; fi
      - name: Validate first-track rail geometry with actual Godot runtime
        run: |
          set -euo pipefail
          export GODOT_BIN="$HOME/godot-bin/godot"
          timeout 180 "$GODOT_BIN" --headless --audio-driver Dummy --script scripts/tests/kart_premium_rail_regression.gd 2>&1 | tee /tmp/rail-tests.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/rail-tests.log; then exit 1; fi
          grep -q '\[PremiumRailKit\] PASS' /tmp/rail-tests.log
      - name: Check unmodified physics unit regressions
        run: |
          set -euo pipefail
          export GODOT_BIN="$HOME/godot-bin/godot"
          timeout 180 "$GODOT_BIN" --headless --audio-driver Dummy --script scripts/tests/kart_physics_regression.gd 2>&1 | tee /tmp/rail-physics.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/rail-physics.log; then exit 1; fi
          grep -q '\[KartPhysics\] PASS' /tmp/rail-physics.log
