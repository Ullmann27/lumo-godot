name: LUMO 2081 integrated World acceptance
on:
  push:
    branches: [integration/godot-2081-20261124]
permissions:
  contents: read
concurrency:
  group: lumo-2081-world-integration
  cancel-in-progress: false
jobs:
  integrated-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and install verified Godot 4.6.3
        run: |
          set -euo pipefail
          mkdir -p integrated-world-proof
          git rev-parse HEAD > integrated-world-proof/commit.txt
          git rev-parse HEAD^{tree} > integrated-world-proof/tree.txt
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import the combined source
        run: |
          set -euo pipefail
          godot --version | tee integrated-world-proof/engine.txt
          godot --headless --editor --import --quit 2>&1 | tee integrated-world-proof/import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' integrated-world-proof/import.log; then exit 1; fi
      - name: Exercise integrated World, dialogs, cards, kart and existing saves
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          checks = [
              ('lumo_world_first_entry_regression', '[LumoWorldFirstEntry] PASS'),
              ('lumo_world_kart_ground_regression', '[LumoWorldKartGround] PASS'),
              ('lumo_world_open_world_integration_regression', '[LumoOpenWorldIntegration] PASS'),
              ('lumo_world_quest_integrity_regression', '[LumoWorldQuestIntegrity] PASS'),
              ('lumo_world_kart_persistence_regression', '[WorldKartPersistence] PASS'),
              ('lumo_world_regression', '[LumoWorld] PASS'),
              ('lumo_world_device_regression', '[LumoWorldDevice] PASS'),
              ('lumo_world_map_regression', '[WorldMap] PASS'),
              ('lumo_world_camera_regression', '[LumoWorldCamera] PASS'),
              ('lumo_65bone_walk_gait_regression', '[LumoGait] PASS'),
          ]
          failed = []
          for name, marker in checks:
              env = dict(os.environ, XDG_DATA_HOME=str(pathlib.Path(os.environ['RUNNER_TEMP']) / name))
              command = ['python3', 'tools/run_godot_probe.py', '--log', f'integrated-world-proof/{name}.log', '--timeout', '360', '--required', marker, '--', 'godot', '--headless', '--path', '.', '--script', f'scripts/tests/{name}.gd']
              if subprocess.run(command, env=env).returncode:
                  failed.append(name)
          if failed:
              raise SystemExit('Failed: ' + ', '.join(failed))
          PY
      - name: Preserve exact integrated source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-2081-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: integrated-world-proof/
          if-no-files-found: error
          retention-days: 30
