name: Lumo verify integrated eleven-track themes

on:
  push:
    branches:
      - lumo-next/eleven-tracks-handoff-20261110
    paths:
      - .github/handoffs/lumo-other-tracks-code.ready

permissions:
  contents: read

jobs:
  verify-current-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove all 16 production/test files equal the verified handoff
        shell: bash
        run: |
          set -euo pipefail
          check() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            echo "$file $actual"
            test "$actual" = "$expected"
          }
          check scripts/games/kart_expansion_world.gd 21119779a0ac66e20b4d6635c250d6d3488500d9
          check scripts/games/kart_track_detail.gd 9ae8a4b9a9feac466a7f0a5c406752e5536a161a
          check scripts/games/track_themes/nature_track_details.gd 7d906d0d5a54f480d233822554d6e5442c6b86a4
          check scripts/games/track_themes/sky_fantasy_track_details.gd b8d55b6f96b62a6b5219aff78365846ce2f899bd
          check scripts/games/track_themes/technology_track_details.gd 9d4172d114cc13be39c18bcfe39db051d8c5c8e4
          check scripts/games/track_themes/track_ground_profile.gd 3e5a62149a16cdf3f19e2cefbf1ad3aba20461c7
          check scripts/games/track_themes/track_theme_geometry.gd ebff0dfde279a84d094f8826d062b64b29b97a10
          check scripts/games/track_themes/track_theme_registry.gd 4ce77e6f31461fbcc42b99e4da0b11e7fdc60ca8
          check scripts/tests/helpers/kart_theme_ground_contact.gd 15f45aef9f74dbad2545472cc7f9deaf24008bea
          check scripts/tests/kart_theme_ground_contact_contract.gd 6826c573d10c5b52fedce8372a67b682ffedca67
          check scripts/tests/kart_track_theme_capture.gd e16f32e2e5e3fe52b54a2380eb4e2b26b4725752
          check scripts/tests/kart_track_theme_contract.gd 6c23a87f4a4f29bddaa808515dbdf0b6d6d3cd86
          check scripts/tests/kart_track_theme_world_regression.gd 5b7b0a250692db6e780ac9b6ccaa7aa9e338caff
          check tools/test_track_theme_contract.py 01420e74bd5877c9c12a967cf76504c09d92e2c8
          check tools/test_track_theme_world.py e539fd2097845e60e6c55d7bad357c8858c1562d
          check tools/test_track_theme_world_runner.py 4771b4aa2fcf23fc002edfab5b2d3257d8d11ee9
          echo "[ElevenTrackIdentity] PASS 16/16 exact files"

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip"             https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Import project and reject parser or shader errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s Godot_v4.6.3-stable_linux.x86_64             --headless --path . --editor --import --quit             > "$RUNNER_TEMP/godot-import.log" 2>&1
          cat "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|ERROR: Failed to load' "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi

      - name: Synthetic theme contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_track_theme_contract.py

      - name: Runner receipt hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_track_theme_world_runner.py -v

      - name: All eleven themes in LOW and HIGH real Godot worlds
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_track_theme_world.py             --track=all --quality=both --timeout-seconds=120             --out="$RUNNER_TEMP/theme-worlds"

      - name: Full static project validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py
