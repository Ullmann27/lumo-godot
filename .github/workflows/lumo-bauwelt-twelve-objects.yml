name: Lumo Bauwelt twelve 3D objects
on:
  push:
    branches: [chatgpt/lumo-bauwelt-12-procedural-assets-2026-10-15]
  pull_request:
    paths:
      - "scripts/creative/build_catalog.gd"
      - "scripts/creative/creative_kit.gd"
      - "scripts/creative/build_premium_props.gd"
      - "scripts/tests/build_premium_props_regression.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-engine
          echo /tmp/godot-engine >> "$GITHUB_PATH"
      - name: Import and parse source
        run: |
          mkdir -p exports/creative-build
          Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import > exports/creative-build/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' exports/creative-build/import.log; then exit 1; fi
      - name: Verify meshes, collision, rotation, undo and persistence
        run: |
          set -o pipefail
          timeout 90s Godot_v4.6.3-stable_linux.x86_64 --headless --script res://scripts/tests/build_premium_props_regression.gd -- --logic-only 2>&1 | tee exports/creative-build/logic.log
          grep -F '[Bauwelt12] PASS:' exports/creative-build/logic.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' exports/creative-build/logic.log; then exit 1; fi
      - name: Render real 3D screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1440x900x24' Godot_v4.6.3-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --resolution 1440x900 --script res://scripts/tests/build_premium_props_regression.gd 2>&1 | tee exports/creative-build/visual.log
          grep -F '[Bauwelt12] PASS: rendered' exports/creative-build/visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' exports/creative-build/visual.log; then exit 1; fi
          test -s exports/creative-build/12_3d_props_gallery.png
      - name: Archive test reports and real screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-bauwelt-12-${{ github.run_id }}
          path: exports/creative-build/
