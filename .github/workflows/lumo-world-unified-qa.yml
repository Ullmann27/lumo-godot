name: LUMO unified Open World QA

on:
  pull_request:
    paths:
      - 'scripts/creative/lumo_world.gd'
      - 'scripts/creative/lumo_world_village.gd'
      - 'scripts/characters/lumo/lumo_world_avatar.gd'
      - 'scripts/characters/lumo/lumo_world_idle_life.gd'
      - 'scripts/characters/lumo/lumo_rigged_actor.gd'
      - 'scripts/tests/lumo_world_regression.gd'
      - '.github/workflows/lumo-world-unified-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import exact source
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit 2>&1 | tee world-import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' world-import.log; then
            exit 1
          fi
      - name: Unified World regression
        run: |
          set -euo pipefail
          python3 tools/run_godot_probe.py \
            --log world-regression.log \
            --timeout 900 \
            --required '[LumoWorld] PASS' -- \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script scripts/tests/lumo_world_regression.gd
      - name: Preserve exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-unified-world-qa
          path: |
            world-import.log
            world-regression.log
          if-no-files-found: warn
          retention-days: 30
