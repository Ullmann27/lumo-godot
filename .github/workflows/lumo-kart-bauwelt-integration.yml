name: Lumo Kart and Bauwelt integration QA
on:
  push:
    branches: [chatgpt/lumo-kart-bauwelt-integrated-2026-10-15]
  pull_request:
    paths:
      - "scripts/games/kart_world.gd"
      - "scripts/games/kart_premium_rail_kit.gd"
      - "scripts/creative/**"
      - "scripts/tests/kart_premium_rail_regression.gd"
      - "scripts/tests/build_premium_props_regression.gd"
      - ".github/workflows/lumo-kart-bauwelt-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-godot-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import all project assets
        run: |
          set -euo pipefail
          /tmp/godot --headless --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Verify real premium rail on Sonnenhafen track
        run: |
          set -euo pipefail
          timeout 120 /tmp/godot --headless --script res://scripts/tests/kart_premium_rail_regression.gd 2>&1 | tee /tmp/rail.log
          grep -F '[PremiumRailKit] PASS' /tmp/rail.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' /tmp/rail.log; then exit 1; fi
      - name: Verify Bauwelt meshes and saved placement states
        run: |
          set -euo pipefail
          timeout 120 /tmp/godot --headless --script res://scripts/tests/build_premium_props_regression.gd -- --logic-only 2>&1 | tee /tmp/bauwelt.log
          grep -F '[Bauwelt12] PASS' /tmp/bauwelt.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' /tmp/bauwelt.log; then exit 1; fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-kart-bauwelt-integration-logs
          path: |
            /tmp/import.log
            /tmp/rail.log
            /tmp/bauwelt.log
          if-no-files-found: ignore
