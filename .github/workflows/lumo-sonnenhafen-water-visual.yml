name: Lumo Sonnenhafen water and visual QA
on:
  push:
    branches: [chatgpt/sonnenhafen-water-visual-qa-2026-10-15]
  pull_request:
    paths:
      - "assets/shaders/kart_water.gdshader"
      - "assets/shaders/kart_waterfall.gdshader"
      - "scripts/games/kart_world.gd"
      - "scripts/tests/kart_sonnenhafen_water_regression.gd"
      - "scripts/tests/kart_sonnenhafen_showcase.gd"
      - ".github/workflows/lumo-sonnenhafen-water-visual.yml"
      - "tools/qa/sonnenhafen_visual_gate.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  godot-runtime-and-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and Mesa software renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import all Godot assets and validate shader syntax
        run: |
          set -euo pipefail
          mkdir -p exports/sonnenhafen logs/sonnenhafen-water
          /tmp/godot --headless --path . --editor --import --quit 2>&1 | tee logs/sonnenhafen-water/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' logs/sonnenhafen-water/import.log; then exit 1; fi
      - name: Verify full and low water in real Sonnenhafen and forest
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot --headless --path . --script res://scripts/tests/kart_sonnenhafen_water_regression.gd 2>&1 | tee logs/sonnenhafen-water/logic.log
          grep -F '[SonnenhafenWater] PASS:' logs/sonnenhafen-water/logic.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' logs/sonnenhafen-water/logic.log; then exit 1; fi
      - name: Verify renderer capability profiles
        run: |
          set -euo pipefail
          timeout 90s /tmp/godot --headless --path . --script res://scripts/tests/kart_renderer_profile_regression.gd 2>&1 | tee logs/sonnenhafen-water/renderer.log
          grep -F '[RendererProfiles] PASS:' logs/sonnenhafen-water/renderer.log
      - name: Capture six real 3D Sonnenhafen views with Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://scripts/tests/kart_sonnenhafen_showcase.gd 2>&1 | tee logs/sonnenhafen-water/visual.log
          grep -F '[SonnenhafenShots] captured 06_overview' logs/sonnenhafen-water/visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' logs/sonnenhafen-water/visual.log; then exit 1; fi
          for name in 01_start_grid 02_grandstand 03_terraced_curve 04_waterfall 05_harbour_run 06_overview; do
            test -s "exports/sonnenhafen/${name}.png"
          done
      - name: Validate real screenshots and produce six-view montage
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet 'Pillow==11.3.0'
          python3 tools/qa/sonnenhafen_visual_gate.py exports/sonnenhafen | tee logs/sonnenhafen-water/image-qa.log
          test -s exports/sonnenhafen/00_sonnenhafen_runtime_montage.png
          test -s exports/sonnenhafen/visual_quality_report.json
      - name: Publish individual unretouched PNG screenshots for direct viewing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=lumo-sonnenhafen-runtime-shots-20261015
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA"               --title "Sonnenhafen: Original-Godot-Screenshots (noch keine APK)"               --notes "Sechs unretuschierte PNG-Aufnahmen aus Godot 4.6.3 GL Compatibility/Mesa; ein Kontaktbogen und technische Bildmetriken. Dies ist KEIN nachgewiesener Android-/Fold-Qualitätsbericht."               --prerelease
          fi
          gh release upload "$TAG" exports/sonnenhafen/*.png             exports/sonnenhafen/visual_quality_report.json --clobber
      - name: Upload real captures and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-sonnenhafen-water-visual-${{ github.run_id }}
          path: |
            exports/sonnenhafen/*.png
            exports/sonnenhafen/visual_quality_report.json
            logs/sonnenhafen-water/*.log
          if-no-files-found: warn
