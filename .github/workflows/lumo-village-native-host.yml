name: LUMO direct economic village native bridge regression
on:
  push:
    branches: [chatgpt/lumo-village-native-host-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  village-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.6.3 pinned release
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import actual native resources
        run: |
          set -euo pipefail
          /tmp/godot --headless --path . --editor --import --quit > /tmp/village-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/village-import.log; then exit 1; fi
      - name: Exercise Godot bridge validation and boot scene
        run: |
          set -euo pipefail
          timeout 90 /tmp/godot --headless --path . --script res://scripts/tests/village_host_launch_regression.gd 2>&1 | tee /tmp/village-native.log
          grep -F '[VillageHost] PASS' /tmp/village-native.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' /tmp/village-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-village-native-bridge-receipt
          path: |
            /tmp/village-import.log
            /tmp/village-native.log
          if-no-files-found: warn
