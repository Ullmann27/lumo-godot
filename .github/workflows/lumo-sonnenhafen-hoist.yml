name: Lumo Sonnenhafen animated container hoist
on:
  push:
    branches:
      - chatgpt/sonnenhafen-animated-crane-hoist-2026-10-17
  pull_request:
    paths:
      - scripts/games/kart_harbor_crane.gd
      - scripts/tests/kart_sonnenhafen_crane_regression.gd
      - .github/workflows/lumo-sonnenhafen-hoist.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-3d-hoist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.6.3 and software rendering
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate actual Godot imports
        run: |
          set -euo pipefail
          timeout 240s godot --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Shader compilation failed' "$RUNNER_TEMP/import.log"
      - name: Execute geometry collision and animated-cable regression
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/tests/kart_sonnenhafen_crane_regression.gd 2>&1 | tee "$RUNNER_TEMP/hoist.log"
          grep -F '[SonnenhafenCrane] PASS:' "$RUNNER_TEMP/hoist.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|ERROR:' "$RUNNER_TEMP/hoist.log"
      - name: Capture actual Sonnenhafen from three reproducible 3D cameras
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LUMO_CAPTURE_DIR: exports/sonnenhafen-hoist/after
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://scripts/tests/kart_pose_capture.gd 2>&1 | tee "$RUNNER_TEMP/capture.log"
          for camera in 01_trackside_view 02_harbor_overview 03_seaside_boom; do
            test -s "exports/sonnenhafen-hoist/after/${camera}.png"
          done
          test -s exports/sonnenhafen-hoist/after/poses.json
      - name: Capture immutable before revision using identical camera poses
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          baseline="$RUNNER_TEMP/sonnenhafen-crane-before"
          git clone --quiet --no-hardlinks . "$baseline"
          git -C "$baseline" remote set-url origin https://github.com/Ullmann27/lumo-godot.git
          git -C "$baseline" fetch --depth 1 origin 61f51b942b2521b506e6b203b89a1b3ec2bd284f
          git -C "$baseline" checkout --detach FETCH_HEAD
          test "$(git -C "$baseline" rev-parse HEAD)" = 61f51b942b2521b506e6b203b89a1b3ec2bd284f
          (cd "$baseline" && timeout 240s godot --headless --path . --editor --import --quit)
          mkdir -p "$original/exports/sonnenhafen-hoist/before"
          (cd "$baseline" && LUMO_POSES="$original/exports/sonnenhafen-hoist/after/poses.json" LUMO_CAPTURE_DIR="$original/exports/sonnenhafen-hoist/before" timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://scripts/tests/kart_pose_capture.gd)
          for camera in 01_trackside_view 02_harbor_overview 03_seaside_boom; do
            test -s "$original/exports/sonnenhafen-hoist/before/${camera}.png"
          done
      - name: Publish exact real before and after 3D screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-sonnenhafen-hoist-before-after-${{ github.run_id }}
          path: exports/sonnenhafen-hoist/
          if-no-files-found: warn
