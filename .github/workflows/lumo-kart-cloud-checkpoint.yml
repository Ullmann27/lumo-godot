name: Lumo Kart safe cloud checkpoint checks

on:
  pull_request:
    paths:
      - AGENTS.md
      - tools/lumo_autosave.py
      - tools/tests/test_lumo_autosave.py
      - .github/workflows/lumo-kart-cloud-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-autosave:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python code and secret filters
        run: |
          python3 -m py_compile tools/lumo_autosave.py tools/tests/test_lumo_autosave.py
          python3 -m unittest discover -v -s tools/tests -p test_lumo_autosave.py
      - name: Check mode must not mutate checkout
        run: python3 tools/lumo_autosave.py check
