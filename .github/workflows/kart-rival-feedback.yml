name: Lumo Kart Rival Feedback

on:
  push:
    branches:
      - chatgpt/kart-rival-feedback-2026-10-07
    paths:
      - "scripts/games/kart_island.gd"
      - "scripts/games/kart_rival_item_fx.gd"
      - "scripts/tests/kart_rival_item_feedback_regression.gd"
      - ".github/workflows/kart-rival-feedback.yml"
  pull_request:
    paths:
      - "scripts/games/kart_island.gd"
      - "scripts/games/kart_rival_item_fx.gd"
      - "scripts/tests/kart_rival_item_feedback_regression.gd"
      - ".github/workflows/kart-rival-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rival-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import and parse
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import --quit \
            > "$RUNNER_TEMP/import.log" 2>&1
          cat "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' "$RUNNER_TEMP/import.log"
      - name: Rival item fairness and visuals
        shell: bash
        run: |
          set -euo pipefail
          timeout 220s Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            --script res://scripts/tests/kart_rival_item_feedback_regression.gd \
            > "$RUNNER_TEMP/rival-feedback.log" 2>&1
          cat "$RUNNER_TEMP/rival-feedback.log"
          ! grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/rival-feedback.log"
          grep -F '[KartRivalFeedback] PASS:' "$RUNNER_TEMP/rival-feedback.log"
      - name: Existing mode regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            --script res://scripts/tests/kart_modes_regression.gd \
            > "$RUNNER_TEMP/kart-modes.log" 2>&1
          cat "$RUNNER_TEMP/kart-modes.log"
          ! grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/kart-modes.log"
          grep -F '[KartModesTests] PASS:' "$RUNNER_TEMP/kart-modes.log"
      - name: Existing physics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            --script res://scripts/tests/kart_physics_regression.gd \
            > "$RUNNER_TEMP/kart-physics.log" 2>&1
          cat "$RUNNER_TEMP/kart-physics.log"
          ! grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/kart-physics.log"
          grep -F '[KartPhysics]' "$RUNNER_TEMP/kart-physics.log"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kart-rival-feedback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/rival-feedback.log
            ${{ runner.temp }}/kart-modes.log
            ${{ runner.temp }}/kart-physics.log
          if-no-files-found: warn
          retention-days: 14
