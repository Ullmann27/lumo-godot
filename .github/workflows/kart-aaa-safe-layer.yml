name: Lumo additive AAA visual layer smoke
on:
  push:
    branches: [codex/lumo-aaa-safe-visuals-2026-10-10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import and compile shader resources
        shell: bash
        run: |
          set -euo pipefail
          timeout 210s Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import --quit > import.log 2>&1
          cat import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' import.log; then exit 1; fi
      - name: Verify additive neon arch and glass renderer fallback
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 150s Godot_v4.6.3-stable_linux.x86_64 --headless --path . --rendering-method gl_compatibility --script res://scripts/tests/kart_aaa_visual_regression.gd > aaa-smoke.log 2>&1
          code=$?
          set -e
          cat aaa-smoke.log
          test "$code" -eq 0
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:|ERROR: Failed to load' aaa-smoke.log; then exit 1; fi
          grep -F '[AAA_VISUAL] PASS:' aaa-smoke.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-aaa-safe-layer-smoke-logs
          path: |
            import.log
            aaa-smoke.log
          retention-days: 30
