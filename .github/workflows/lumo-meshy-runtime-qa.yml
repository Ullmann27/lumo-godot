name: LUMO Meshy production runtime QA
on:
  push:
    branches: [asset/lumo-meshy-intake-20261123, fix/lumo-2077-driver-lod-qa-20261124]
    paths:
      - assets/kart/production/meshy/**
      - assets/kart/production/garage/meshy_*.glb
      - scripts/games/kart_production_vehicle.gd
      - scripts/games/kart_garage_interior.gd
      - scripts/tests/kart_meshy_assets_regression.gd
      - config/kart-action-qa.json
      - .github/workflows/lumo-meshy-runtime-qa.yml
  pull_request:
    paths:
      - assets/kart/production/drivers/**
      - assets/characters/rivals/roster.json
      - assets/kart/production/meshy/**
      - assets/kart/production/garage/meshy_*.glb
      - scripts/games/kart_catalog.gd
      - scripts/games/kart_island.gd
      - scripts/games/kart_garage_menu.gd
      - scripts/games/kart_garage_interior.gd
      - scripts/games/kart_production_driver.gd
      - scripts/games/kart_production_vehicle.gd
      - scripts/games/kart_vehicle.gd
      - scripts/games/lumo_opponent_roster.gd
      - scripts/games/kart_rival_model_contract.gd
      - scripts/tests/kart_extra_drivers_regression.gd
      - scripts/tests/kart_meshy_assets_regression.gd
      - config/kart-action-qa.json
      - .github/workflows/lumo-meshy-runtime-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumo-meshy-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" meshy-proof
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot/engine.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import production GLBs and parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --single-threaded-scene --path . --editor --import --quit > meshy-proof/import.log 2>&1
          python3 tools/validate_project.py | tee meshy-proof/validator.log
      - name: Verify complete driver roster and all 27 imported LOD source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          import subprocess
          from pathlib import Path

          root = Path('assets/kart/production/drivers')
          roster = json.loads(Path('assets/characters/rivals/roster.json').read_text())
          manifest = json.loads((root / 'manifest.json').read_text())
          expected = {'lion', 'owl', 'rabbit', 'squirrel', 'turtle', 'frog',
                      'otter', 'badger', 'cat'}
          entries = [row for row in roster['opponents'] if 'kart' in row['games']]
          assert len(entries) == len(expected)
          assert {row['id'] for row in entries} == expected
          proof = []
          for row in entries:
              assert row['runtimeReady'] is True, row['id']
              identity = row['id']
              filenames = ('driver.glb', 'driver_lod1.glb', 'driver_lod2.glb')
              paths = [root / identity / name for name in filenames]
              assert row['godotLods'] == ['res://' + p.as_posix() for p in paths], identity
              for level, path in enumerate(paths):
                  assert path.is_file() and not path.is_symlink(), path
                  raw = path.read_bytes()
                  assert len(raw) >= 20, path
                  magic, version, length = struct.unpack_from('<4sII', raw)
                  assert (magic, version, length) == (b'glTF', 2, len(raw)), path
                  json_length, chunk = struct.unpack_from('<I4s', raw, 12)
                  assert chunk == b'JSON' and 20 + json_length <= len(raw), path
                  gltf = json.loads(raw[20:20 + json_length])
                  assert gltf['asset']['version'] == '2.0', path
                  assert gltf.get('meshes') and gltf.get('skins') and gltf.get('animations'), path
                  proof.append({'id': identity, 'lod': level, 'path': path.as_posix(),
                                'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          by_path = {row['path']: row for row in proof}
          assert len(proof) == len(by_path) == 27
          # The six authored originals have a separate checksum manifest.
          # The additional three identities are still checked and hashed above.
          assert {row['id'] for row in manifest['drivers']} == {
              'lion', 'owl', 'rabbit', 'squirrel', 'turtle', 'frog'}
          for row in manifest['drivers']:
              assert len(row['lods']) == 3, row['id']
              assert {lod['file'] for lod in row['lods']} == {
                  p['path'] for p in proof if p['id'] == row['id']}
              for lod in row['lods']:
                  actual = by_path[lod['file']]
                  assert actual['bytes'] == lod['bytes'], lod['file']
                  assert actual['sha256'] == lod['sha256'], lod['file']
          Path('meshy-proof/driver-lod-source.json').write_text(json.dumps({
              'status': 'PASS',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'scope': 'GLB source integrity and roster mapping, not a render or device test',
              'models': proof,
          }, indent=2) + '\n')
          print('[DriverLOD] PASS: 9 imported rival identities and 27 GLB sources')
          PY
      - name: Run Meshy and preserved-Kart regressions
        shell: bash
        run: |
          set -euo pipefail
          probes=(
            kart_meshy_assets_regression
            kart_vehicle_regression
            kart_dyno_parts_regression
            kart_extra_drivers_regression
            kart_evolution_regression
          )
          for probe in "${probes[@]}"; do
            log="meshy-proof/${probe}.log"
            godot --headless --path . --script "res://scripts/tests/${probe}.gd" --check-only >> "$log" 2>&1
            timeout 420s godot --headless --path . --script "res://scripts/tests/${probe}.gd" >> "$log" 2>&1
            cat "$log"
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|\] FAIL' "$log"; then
              exit 1
            fi
          done
          grep -E '^EXTRA_DRIVERS_PASS checks=[1-9][0-9]* failures=0$' meshy-proof/kart_extra_drivers_regression.log
          grep -F '[MeshyKart] PASS: 14 fitted close shells, preserved chassis/LODs and high-detail garage props' meshy-proof/kart_meshy_assets_regression.log
      - name: Verify immutable production asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('assets/kart/production/meshy/manifest.json').read_text())
          assert len(m['vehicles'])==14
          assert len(m['garage'])==2
          for row in m['vehicles']+m['garage']:
              p=pathlib.Path(row['path'])
              data=p.read_bytes()
              assert data[:4]==b'glTF'
              assert len(data)==row['bytes']
              assert hashlib.sha256(data).hexdigest()==row['sha256']
          print('[MeshyManifest] PASS: 14 vehicle shells + 2 garage props')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-meshy-runtime-proof-${{ github.run_id }}
          path: meshy-proof/
          retention-days: 14
