name: Lumo Kart targeted geometry diagnosis
on:
  push:
    branches: [integration/kart-action-20261123]
    paths:
      - config/kart-diagnostics.json
      - .github/workflows/kart-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: kart-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lumo-kart-godot" kart-proof
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/lumo-kart-godot/engine.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/lumo-kart-godot/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-kart-godot/engine.zip" -d "$RUNNER_TEMP/lumo-kart-godot"
          mv "$RUNNER_TEMP/lumo-kart-godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/lumo-kart-godot/godot"
          echo "$RUNNER_TEMP/lumo-kart-godot" >> "$GITHUB_PATH"
          git rev-parse HEAD > kart-proof/SOURCE-COMMIT.txt
      - name: Import actual complete project
        id: project_import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --single-threaded-scene --path . --editor --import --quit > kart-proof/import-first.log 2>&1 \
            || godot --headless --single-threaded-scene --path . --editor --import --quit > kart-proof/import-retry.log 2>&1
      - name: Prepare genuine offscreen renderer
        id: renderer_setup
        if: ${{ !cancelled() && steps.project_import.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb xauth libgl1-mesa-dri
          python3 -m pip install Pillow==12.3.0
      - name: Exercise actual geometry and mounted tuning with OpenGL
        if: ${{ !cancelled() && steps.renderer_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, signal, subprocess, time
          from PIL import Image
          root = pathlib.Path('kart-proof').resolve()
          jobs = [
              ('zauberwald','kart_action_spectacle_capture',['--track=zauberwald','--views=landscape,course','--out='+str(root/'zauberwald')]),
              ('galaxy_ringway','kart_action_spectacle_capture',['--track=galaxy_ringway','--views=course,landscape','--out='+str(root/'galaxy_ringway')]),
              ('precision','kart_sonnenhafen_stunt_regression',[]),
              ('spectacle','kart_action_spectacle_regression',[])
          ]
          results = []
          for label, script, args in jobs:
              output = root / label
              output.mkdir(parents=True,exist_ok=True)
              env = dict(os.environ,LUMO_KART_ACTION_PROOF_DIR=str(output))
              command = ['xvfb-run','-a','godot','--path','.',
                  '--rendering-method','gl_compatibility','--audio-driver','Dummy',
                  '--resolution','1280x720','--script','res://scripts/tests/'+script+'.gd']
              if args:
                  command += ['--'] + args
              log = root / (label+'.log')
              reason = None
              with log.open('w') as stream:
                  process = subprocess.Popen(command,env=env,stdout=stream,
                      stderr=subprocess.STDOUT,start_new_session=True)
                  deadline = time.monotonic()+240
                  while process.poll() is None:
                      contents = log.read_text(errors='replace')
                      if any(marker in contents for marker in ('SCRIPT ERROR:','Parse Error:','Compile Error:','SHADER ERROR:')):
                          reason = 'engine error'
                      elif time.monotonic() >= deadline:
                          reason = 'timeout'
                      if reason:
                          os.killpg(process.pid,signal.SIGTERM)
                          try:
                              process.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid,signal.SIGKILL)
                              process.wait()
                          break
                      time.sleep(0.25)
                  code = process.wait()
              contents = log.read_text(errors='replace')
              results.append({'case':label,'exit':code,'error':reason,
                  'passed':code == 0 and reason is None and '] FAIL' not in contents})
              print(json.dumps(results[-1]),flush=True)
              print(contents,flush=True)
          manifest = []
          for path in sorted(root.rglob('*.png')):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              manifest.append({'path':str(path.relative_to(root)),'bytes':len(data),'sha256':digest})
              with Image.open(path) as picture:
                  picture = picture.convert('RGB')
                  picture.thumbnail((960,540))
                  buffer = io.BytesIO()
                  picture.save(buffer,format='JPEG',quality=85)
              print('KART_RENDER_PREVIEW '+json.dumps({
                  'path':str(path.relative_to(root)),
                  'source_sha256':digest,
                  'jpeg_base64':base64.b64encode(buffer.getvalue()).decode()}),flush=True)
          (root/'diagnostic-results.json').write_text(json.dumps(results,indent=2))
          (root/'render-manifest.json').write_text(json.dumps(manifest,indent=2))
          if not all(row['passed'] for row in results):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kart-diagnostic-proof-${{ github.run_id }}
          path: kart-proof/
      - name: Preserve verified engine for matching local reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.6.3-verified-runtime
          path: ${{ runner.temp }}/lumo-kart-godot/engine.zip
          if-no-files-found: error
          compression-level: 0
