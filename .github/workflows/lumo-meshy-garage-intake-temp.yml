          path: garage_intake/
          retention-days: 14
          compression-level: 0
      - name: Commit durable garage-world candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p art/lumo_kart/meshy_incoming/garage_models art/lumo_kart/meshy_incoming/garage_source_images
          cp garage_intake/models/*.glb art/lumo_kart/meshy_incoming/garage_models/
          cp garage_intake/source_images/*.png art/lumo_kart/meshy_incoming/garage_source_images/
          cp garage_intake/manifest.json art/lumo_kart/meshy_incoming/garage_manifest.json
          git config user.name "LUMO Asset Intake"
          git config user.email "64243701+Ullmann27@users.noreply.github.com"
          git add art/lumo_kart/meshy_incoming
          git commit -m "assets(kart): preserve four Meshy garage-world candidates"
          git push origin HEAD:asset/lumo-meshy-intake-20261123
