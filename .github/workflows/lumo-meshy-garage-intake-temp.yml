          echo "04 01a208fb-255d-7770-a1e7-c5e76d827ffa" >> garage_intake/task_ids.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          root=pathlib.Path("garage_intake")
          tasks={}
          for line in (root/"task_ids.txt").read_text().splitlines():
              n,task=line.split()
              tasks[n]=task
          rows=[]
          for n,task in sorted(tasks.items()):
              glb=root/"models"/f"garage_{n}.glb"
              png=root/"source_images"/f"garage_{n}.png"
              data=glb.read_bytes()
              assert data[:4]==b"glTF" and len(data)>1000
              _,version,total=struct.unpack("<4sII",data[:12])
              assert version==2 and total==len(data)
              image=png.read_bytes()
              assert image.startswith(b"\x89PNG\r\n\x1a\n")
              rows.append({"index":int(n),"task_id":task,"glb_bytes":len(data),"glb_sha256":hashlib.sha256(data).hexdigest(),"source_sha256":hashlib.sha256(image).hexdigest()})
          assert len(rows)==4
          (root/"manifest.json").write_text(json.dumps({"count":4,"identity_policy":"task identity only; classify after visual review","items":rows},indent=2)+"\n")
          PY
