name: Lumo Kart action and live network verification
on:
  push:
    branches: [integration/kart-action-20261123]
    paths:
      - config/kart-action-qa.json
      - .github/workflows/kart-action-20261123.yml
permissions:
  contents: read
concurrency:
  group: kart-action-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact relay dependency
        run: python -m pip install -r server/kart_online/requirements.txt
      - name: Exercise actual WebSocket clients and server boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kart-proof
          git rev-parse HEAD > kart-proof/SOURCE-COMMIT.txt
          python -m unittest discover -s server/kart_online -p test_relay.py -v 2>&1 | tee kart-proof/relay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kart-relay-proof-${{ github.run_id }}
          path: kart-proof/
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lumo-kart-godot" kart-proof
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/lumo-kart-godot/engine.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/lumo-kart-godot/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-kart-godot/engine.zip" -d "$RUNNER_TEMP/lumo-kart-godot"
          mv "$RUNNER_TEMP/lumo-kart-godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/lumo-kart-godot/godot"
          echo "$RUNNER_TEMP/lumo-kart-godot" >> "$GITHUB_PATH"
          git rev-parse HEAD > kart-proof/SOURCE-COMMIT.txt
      - name: Import actual complete project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --single-threaded-scene --path . --editor --import --quit > kart-proof/import-first.log 2>&1 \
            || godot --headless --single-threaded-scene --path . --editor --import --quit > kart-proof/import-retry.log 2>&1
      - name: Run selected physics and vehicle checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          config = json.loads(pathlib.Path('config/kart-action-qa.json').read_text())
          results = []
          for name in config['probes']:
              assert re.fullmatch(r'[a-z0-9_]+', name), name
              target = pathlib.Path('scripts/tests') / (name + '.gd')
              assert target.is_file(), target
              log = pathlib.Path('kart-proof') / (name + '.log')
              try:
                  with log.open('w') as stream:
                      run = subprocess.run(['godot','--headless','--path','.','--script',
                          'res://' + str(target)],stdout=stream,stderr=subprocess.STDOUT,timeout=360)
                  output = log.read_text(errors='replace')
                  failed = run.returncode != 0 or any(marker in output for marker in
                      ('SCRIPT ERROR:', 'Parse Error:', 'Compile Error:', '] FAIL'))
                  results.append({'probe':name,'exit':run.returncode,'passed':not failed})
                  print(output[-16000:],flush=True)
              except subprocess.TimeoutExpired:
                  results.append({'probe':name,'passed':False,'error':'timeout'})
          pathlib.Path('kart-proof/native-results.json').write_text(json.dumps(results,indent=2))
          if not results or not all(row['passed'] for row in results):
              raise SystemExit(1)
          PY
      - name: Prepare genuine offscreen renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb xauth libgl1-mesa-dri
          python3 -m pip install Pillow==12.3.0
      - name: Render actual vehicles, workshop and all fifteen courses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess
          from PIL import Image
          root = pathlib.Path('kart-proof').resolve()
          tracks = ['sonnenhafen','zauberwald','bergwelt','holo_city',
              'crystal_canyon','jungle_temple','candy_cloud','volcano_night',
              'winter_sprint','galaxy_ringway','desert_drift','learning_lab',
              'jungle_emerald_3600','riesengarten_2400','windwerk_3000']
          jobs = [('vehicles','kart_evolution_capture',[])]
          for track in tracks:
              views = 'course,landscape'
              if track == 'sonnenhafen':
                  views += ',loop_approach,loop_side,loop_exit'
              jobs.append((track,'kart_action_spectacle_capture',[
                  '--track='+track, '--out='+str(root/track), '--views='+views]))
          results = []
          for label,script,args in jobs:
              output = root/label
              output.mkdir(parents=True,exist_ok=True)
              environment = dict(os.environ)
              environment['LUMO_KART_ACTION_PROOF_DIR'] = str(output)
              command = ['xvfb-run','-a','godot','--path','.',
                  '--rendering-method','gl_compatibility','--audio-driver','Dummy',
                  '--resolution','1280x720','--script','res://scripts/tests/'+script+'.gd']
              if args: command += ['--'] + args
              log = root/(label+'-render.log')
              try:
                  with log.open('w') as stream:
                      run = subprocess.run(command,env=environment,stdout=stream,
                          stderr=subprocess.STDOUT,timeout=240)
                  text = log.read_text(errors='replace')
                  pngs = list(output.rglob('*.png'))
                  passed = run.returncode == 0 and bool(pngs) and not any(marker in text
                      for marker in ('SCRIPT ERROR:', 'Parse Error:', 'Compile Error:'))
                  results.append({'case':label,'passed':passed,'exit':run.returncode,'pngs':len(pngs)})
                  print(label, json.dumps(results[-1]), flush=True)
                  if not passed: print(text[-20000:],flush=True)
              except subprocess.TimeoutExpired:
                  results.append({'case':label,'passed':False,'error':'timeout'})
          manifest = []
          for path in sorted(root.rglob('*.png')):
              data = path.read_bytes()
              manifest.append({'path':str(path.relative_to(root)),'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest()})
              with Image.open(path) as picture:
                  picture = picture.convert('RGB')
                  picture.thumbnail((800,450))
                  buffer = io.BytesIO()
                  picture.save(buffer,format='JPEG',quality=78)
              print('KART_RENDER_PREVIEW '+json.dumps({'path':str(path.relative_to(root)),
                  'source_sha256':hashlib.sha256(data).hexdigest(),
                  'jpeg_base64':base64.b64encode(buffer.getvalue()).decode()}),flush=True)
          (root/'render-results.json').write_text(json.dumps(results,indent=2))
          (root/'render-manifest.json').write_text(json.dumps(manifest,indent=2))
          if not all(row['passed'] for row in results): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kart-native-proof-${{ github.run_id }}
          path: kart-proof/
