name: LUMO nextgen English Quiz and Memory authorities

on:
  push:
    branches: [chatgpt/lumo-nextgen-feature-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumo-nextgen-authorities-${{ github.sha }}
  cancel-in-progress: true

env:
  HOST_SOURCE: 50503fef8e93700d9a889e33c3d2c37fccb46e42
  LIBGL_ALWAYS_SOFTWARE: '1'

jobs:
  production-authorities:
    name: ${{ matrix.activity }} actual authority
    strategy:
      fail-fast: false
      matrix:
        activity: [english, quiz, memory]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: native-source
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Ullmann27/lumo-lernen
          ref: ${{ env.HOST_SOURCE }}
          path: host-source
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install the exact verified Godot and actual software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Record exact sources and import the complete original native project
        id: import_source
        env:
          EXPECTED_NATIVE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p authority-evidence
          test "$(git -C native-source rev-parse HEAD)" = "$EXPECTED_NATIVE"
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_SOURCE"
          git -C native-source rev-parse HEAD > authority-evidence/NATIVE-SOURCE.txt
          git -C native-source rev-parse 'HEAD^{tree}' > authority-evidence/NATIVE-TREE.txt
          git -C host-source rev-parse HEAD > authority-evidence/HOST-SOURCE.txt
          git -C host-source rev-parse 'HEAD^{tree}' > authority-evidence/HOST-TREE.txt
          godot --version > authority-evidence/godot-version.txt
          dart --version > authority-evidence/dart-version.txt 2>&1
          python3 native-source/tools/validate_project.py 2>&1 | tee authority-evidence/project-validation.log
          godot --headless --path native-source --editor --import --quit 2>&1 | tee authority-evidence/import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' authority-evidence/import.log; then exit 1; fi
      - name: Resolve the pinned existing host dependencies
        id: host_dependencies
        working-directory: host-source
        run: flutter pub get --enforce-lockfile
      - name: Exercise the actual authority for this activity
        working-directory: host-source
        env:
          ACTIVITY: ${{ matrix.activity }}
        run: |
          set -euo pipefail
          case "$ACTIVITY" in
            english)
              dart run tool/check_native_english_activity.dart --out ../authority-evidence/english-activity.json 2>&1 | tee ../authority-evidence/english-authority.log
              ;;
            quiz)
              dart run tools/android_qa/quiz_round_contract.dart 2>&1 | tee ../authority-evidence/quiz-authority-contract.log
              ;;
            memory)
              dart tools/android_qa/memory_round_contract.dart 2>&1 | tee ../authority-evidence/memory-authority-contract.log
              dart tools/android_qa/memory_turn_scheduler_contract.dart 2>&1 | tee ../authority-evidence/memory-scheduler-contract.log
              ;;
            *) exit 1 ;;
          esac
      - name: Exercise English meshes with actual host producer output
        if: ${{ matrix.activity == 'english' }}
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-english-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/lumo-english-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lumo-english-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 native-source/tools/run_godot_probe.py \
            --log authority-evidence/english-render.log --timeout 900 --required LEARNING_ENGLISH_PASS -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path native-source \
            --rendering-method gl_compatibility --audio-driver Dummy --disable-vsync \
            --script res://scripts/tests/learning_english_regression.gd -- --capture \
            --output="$GITHUB_WORKSPACE/authority-evidence/english-native" \
            --task-fixtures="$GITHUB_WORKSPACE/authority-evidence/english-activity.json"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('authority-evidence')
          report = json.loads((folder / 'english-native/learning-english-report.json').read_text())
          assert report['fixture_kind'] == 'actual_dart_producer_report'
          assert report['task_fixture_sha256'] == hashlib.sha256((folder / 'english-activity.json').read_bytes()).hexdigest()
          assert report['failures'] == [] and report['renderer'] != 'headless'
          assert len(list((folder / 'english-native').glob('*.png'))) == 17
          PY
      - name: Play all twenty Quiz questions through the real Dart and Godot processes
        if: ${{ !cancelled() && matrix.activity == 'quiz' && steps.import_source.outcome == 'success' && steps.host_dependencies.outcome == 'success' }}
        env:
          EXPECTED_NATIVE: ${{ github.sha }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x2560x24' python3 native-source/tools/run_quiz_native_authority.py \
            --native native-source --host host-source \
            --expected-native "$EXPECTED_NATIVE" --expected-host "$HOST_SOURCE" \
            --output authority-evidence/quiz-pair --capture
      - name: Reject inconsistent Memory pair evidence
        if: ${{ matrix.activity == 'memory' }}
        run: python3 -m unittest discover -s native-source/tools/tests -p test_memory_native_pair_evidence.py -v
      - name: Render the actual Memory geometry and touch layouts
        if: ${{ matrix.activity == 'memory' }}
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-memory-view-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/lumo-memory-view-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lumo-memory-view-cache"
          export LUMO_MEMORY_CAPTURE_DIR="$GITHUB_WORKSPACE/authority-evidence/memory-view"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 native-source/tools/run_godot_probe.py \
            --log authority-evidence/memory-view.log --timeout 900 --required MEMORY_VIEW_PASS -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path native-source \
            --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --disable-vsync \
            --script res://scripts/tests/memory_table_regression.gd -- --capture
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('authority-evidence/memory-view')
          report = json.loads((folder / 'memory-view-result.json').read_text())
          assert report['status'] == 'PASS' and report['errors'] == [] and report['capture'] is True
          assert len(report['captures']) == 8 and len(list(folder.glob('*.png'))) == 8
          PY
      - name: Play Memory through the actual Dart and Godot processes
        if: ${{ !cancelled() && matrix.activity == 'memory' && steps.import_source.outcome == 'success' && steps.host_dependencies.outcome == 'success' }}
        env:
          EXPECTED_NATIVE: ${{ github.sha }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x2560x24' python3 native-source/tools/run_memory_native_authority.py \
            --native native-source --host host-source \
            --expected-native "$EXPECTED_NATIVE" --expected-host "$HOST_SOURCE" \
            --output authority-evidence/memory-pair --capture
      - name: Verify both tracked source trees remain unchanged
        if: always()
        run: |
          set -euo pipefail
          git -C native-source diff --exit-code HEAD --
          git -C host-source diff --exit-code HEAD --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-actual-authority-evidence-${{ matrix.activity }}
          path: |
            authority-evidence/
            !authority-evidence/**/user/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
