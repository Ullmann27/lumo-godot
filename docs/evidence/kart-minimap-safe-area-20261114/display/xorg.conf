Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "LumoDummy"
    Driver "dummy"
    VideoRam 262144
EndSection
Section "Monitor"
    Identifier "LumoMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "2560x2560" 550.00 2560 2720 2992 3424 2560 2563 2573 2677
EndSection
Section "Screen"
    Identifier "LumoScreen"
    Device "LumoDummy"
    Monitor "LumoMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 2560 2560
        Modes "2560x2560"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "LumoLayout"
    Screen "LumoScreen"
EndSection
