services:
  - type: web
    name: lumo-kart-online
    runtime: python
    plan: free
    rootDir: server/kart_online
    buildCommand: pip install -r requirements.txt
    startCommand: python relay.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
